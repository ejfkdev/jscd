# 语料生成与对拍用的 Node 版本（scripts/mkcorpus.sh 通过 `mise exec node@X` 调用）。
# harness 跑的是 .mise 里这批；矩阵还会用到更老的线（8.17 / 12.5 …），用
# `mise install node@8.17.0 …` 单独装，见 README「验证」一节。
# 注：≤15 无 arm64 官方二进制，用 x64 + Rosetta 运行。
[tools]
node = ["10.24.1", "12.22.12", "14.21.3", "16.20.2", "18.20.8", "20.20.2", "22.12.0", "24.12.0"]
