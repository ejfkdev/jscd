[package]
name = "jscd"
description = "Reverse bytenode-compiled .jsc (V8 code cache) back to JavaScript"
repository = "https://github.com/ejfkdev/jscd"
homepage = "https://github.com/ejfkdev/jscd"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"   # swc（JS 优化器）需要较新的 rustc
license = "MIT"
keywords = ["bytenode", "v8", "jsc", "reverse-engineering", "bytecode"]
categories = ["command-line-utilities"]

# cargo-binstall（`cargo binstall jscd`）：产物是**裸二进制**、资产名不用 rustc 三元组，
# 所以除了默认模板还要逐目标覆写 pkg-url（pkg-fmt = "bin" 表示"URL 本身就是可执行文件"）。
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-macos-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-macos-amd64"

# linux-amd64 是静态 musl，glibc 系统同样能用 → gnu/musl 两个目标都指它
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-amd64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-amd64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-arm64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-windows-amd64.exe"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-windows-arm64.exe"

[lib]
name = "jscd"
path = "src/lib.rs"

[[bin]]
name = "jscd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brotli = "8"
# AST 级优化用 swc（terser 的 Rust 移植）：解析 → 压缩（复制传播/无用代码删除/常量折叠）→ 打印。
# 只要 ecma 那几个子集，不要 bundler/typescript 那堆。
swc_core = { version = "81", default-features = false, features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_codegen",
    "ecma_visit",
    "ecma_transforms",
    "ecma_minifier",
] }

# Windows 上取系统区域设置（GetUserDefaultLocaleName）用；其它平台不编译。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[profile.release]
lto = true
codegen-units = 1
